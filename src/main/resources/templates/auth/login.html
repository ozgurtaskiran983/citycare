<!DOCTYPE html>
<!--
  auth/login.html - Login page.
  Spring Security processes the POST /login form.
  Error/logout/expired messages are set by AuthController query params.
-->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — Giriş Yap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#0b3d6e 0%,#1a6fc4 60%,#63b3ed 100%);
         display:flex;align-items:center;justify-content:center}
    .login-card{width:100%;max-width:440px;border:none;border-radius:1.25rem;
                box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
    .login-header{background:linear-gradient(120deg,#0b3d6e,#1a6fc4);
                  color:#fff;padding:2rem;text-align:center}
    .login-body{padding:2rem;background:#fff}
    .form-control:focus{border-color:#1a6fc4;box-shadow:0 0 0 .2rem rgba(26,111,196,.2)}
    .btn-login{background:linear-gradient(135deg,#1a6fc4,#0b3d6e);border:none;
               color:#fff;font-weight:600;padding:.75rem;border-radius:.6rem}
    .btn-login:hover{background:linear-gradient(135deg,#0b3d6e,#1a6fc4);color:#fff}
    .input-group-text{background:#f0f4fa;border-right:0;color:#1a6fc4}
    .form-control.left-join{border-left:0}
  </style>
</head>
<body>
<div class="login-card">
  <!-- Başlık -->
  <div class="login-header">
    <i class="bi bi-building-check" style="font-size:3rem"></i>
    <h1 class="fs-4 fw-bold mt-2 mb-0">CityCare</h1>
    <p class="small opacity-75 mb-0">Akıllı Şehir İhbar Sistemi</p>
  </div>

  <!-- Form alanı -->
  <div class="login-body">
    <h5 class="mb-4 text-center text-muted fw-normal">Hesabınıza giriş yapın</h5>

    <div th:if="${errorMsg}"
         class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${logoutMsg}"
         class="alert alert-success d-flex align-items-center gap-2 py-2">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${logoutMsg}"></span>
    </div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary" for="username">
          Kullanıcı Adı
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" id="username" name="username"
                 class="form-control left-join"
                 placeholder="Kullanıcı adınızı giriniz"
                 autocomplete="username" required autofocus/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary" for="password">
          Şifre
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="password" name="password"
                 class="form-control left-join"
                 placeholder="Şifrenizi giriniz"
                 autocomplete="current-password" required/>
        </div>
      </div>

      <button type="submit" class="btn btn-login w-100 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted small mb-2">Hesabınız yok mu?</p>
      <a href="/register" class="btn btn-outline-primary btn-sm px-4 rounded-pill">
        <i class="bi bi-person-plus me-1"></i>Kayıt Ol
      </a>
    </div>

    <!-- Demo bilgisi -->
    <div class="alert alert-light border mt-4 p-2 small text-muted text-center">
      <strong>Demo:</strong>
      Yönetici: <code>admin / admin123</code>
      &nbsp;|&nbsp;
      Vatandaş: <code>vatandas / vatandas123</code>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
