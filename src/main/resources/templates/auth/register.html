<!DOCTYPE html>
<!--
  auth/register.html - New citizen account registration form.
  POST /register is handled by AuthController.register().
-->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — Kayıt Ol</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#0b3d6e 0%,#1a6fc4 60%,#63b3ed 100%);
         display:flex;align-items:center;justify-content:center}
    .reg-card{width:100%;max-width:460px;border:none;border-radius:1.25rem;
              box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .reg-header{background:linear-gradient(120deg,#0b3d6e,#1a6fc4);
                color:#fff;padding:1.75rem;text-align:center;border-radius:1.25rem 1.25rem 0 0}
    .reg-body{padding:2rem;background:#fff;border-radius:0 0 1.25rem 1.25rem}
    .input-group-text{background:#f0f4fa;border-right:0;color:#1a6fc4}
    .form-control.left-join{border-left:0}
    .form-control:focus{border-color:#1a6fc4;box-shadow:0 0 0 .2rem rgba(26,111,196,.2)}
    .btn-register{background:linear-gradient(135deg,#1a6fc4,#0b3d6e);border:none;
                  color:#fff;font-weight:600;padding:.7rem;border-radius:.6rem}
    .btn-register:hover{background:linear-gradient(135deg,#0b3d6e,#1a6fc4);color:#fff}
    .strength-bar{height:5px;border-radius:3px;transition:all .3s;width:0%}
  </style>
</head>
<body>
<div class="reg-card">
  <div class="reg-header">
    <i class="bi bi-person-plus-fill" style="font-size:2.5rem"></i>
    <h1 class="fs-4 fw-bold mt-2 mb-0">Kayıt Ol</h1>
    <p class="small opacity-75 mb-0">CityCare hesabı oluşturun</p>
  </div>
  <div class="reg-body">

    <div th:if="${errorMsg}"
         class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${successMsg}"
         class="alert alert-success d-flex align-items-center gap-2 py-2">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${successMsg}"></span>
    </div>

    <form th:action="@{/register}" method="post" id="registerForm">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Kullanıcı Adı</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="username" class="form-control left-join"
                 placeholder="En az 3 karakter" minlength="3" maxlength="50" required/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Şifre</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="pw" name="password"
                 class="form-control left-join"
                 placeholder="En az 6 karakter" minlength="6" required/>
        </div>
        <div id="strengthBar" class="strength-bar bg-secondary mt-1"></div>
        <div class="form-text" id="strengthLabel"></div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary">Şifre Tekrar</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" id="pwConfirm" name="confirmPassword"
                 class="form-control left-join"
                 placeholder="Şifrenizi tekrar girin" required/>
        </div>
        <div id="matchMsg" class="form-text"></div>
      </div>

      <button type="submit" class="btn btn-register w-100 mb-3">
        <i class="bi bi-person-check me-2"></i>Kayıt Ol
      </button>
    </form>

    <div class="text-center">
      <span class="text-muted small">Zaten hesabınız var mı?</span>
      <a href="/login" class="btn btn-outline-primary btn-sm px-4 rounded-pill ms-2">
        <i class="bi bi-box-arrow-in-right me-1"></i>Giriş Yap
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Şifre gücü göstergesi
const pw = document.getElementById('pw'), bar = document.getElementById('strengthBar');
const lbl = document.getElementById('strengthLabel');
const labels = ['','Çok Zayıf','Zayıf','Orta','Güçlü','Çok Güçlü'];
const colors  = ['','bg-danger','bg-danger','bg-warning','bg-info','bg-success'];
pw.addEventListener('input', () => {
  let s = 0;
  if (pw.value.length >= 6) s++;
  if (pw.value.length >= 10) s++;
  if (/[A-Z]/.test(pw.value)) s++;
  if (/[0-9]/.test(pw.value)) s++;
  if (/[^A-Za-z0-9]/.test(pw.value)) s++;
  bar.className = 'strength-bar mt-1 ' + (colors[s] || 'bg-secondary');
  bar.style.width = (s * 20) + '%';
  lbl.textContent = labels[s] || '';
});

// Şifre eşleşme kontrolü
const confirm = document.getElementById('pwConfirm');
const matchMsg = document.getElementById('matchMsg');
confirm.addEventListener('input', () => {
  if (confirm.value === pw.value) {
    matchMsg.textContent = '✓ Şifreler eşleşiyor';
    matchMsg.className = 'form-text text-success';
  } else {
    matchMsg.textContent = '✗ Şifreler eşleşmiyor';
    matchMsg.className = 'form-text text-danger';
  }
});
</script>
</body>
</html>
