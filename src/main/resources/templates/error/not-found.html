<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sayfa Bulunamadı — CityCare</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body style="background:#f4f7fb">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <i class="bi bi-search" style="font-size:5rem;color:#1a6fc4;opacity:.3"></i>
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h4 class="fw-bold" th:text="${errorTitle} ?: 'Sayfa Bulunamadı'"></h4>
        <p class="text-muted" th:text="${errorMessage} ?: 'Aradığınız kaynak bulunamadı.'"></p>
        <a href="/reports" class="btn btn-primary rounded-pill px-5 mt-2">
            <i class="bi bi-house me-2"></i>Ana Sayfaya Dön
        </a>
    </div>
</div>
</body>
</html>
