<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Hata ' + ${status} + ' — CityCare'">Hata</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body style="background:#f4f7fb">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center" style="max-width:480px">
        <div th:switch="${status}">
            <i th:case="'404'" class="bi bi-search"
               style="font-size:5rem;color:#1a6fc4;opacity:.3"></i>
            <i th:case="'403'" class="bi bi-shield-x"
               style="font-size:5rem;color:#dc3545;opacity:.35"></i>
            <i th:case="'500'" class="bi bi-exclamation-triangle"
               style="font-size:5rem;color:#fd7e14;opacity:.35"></i>
            <i th:case="*" class="bi bi-bug"
               style="font-size:5rem;color:#6c757d;opacity:.35"></i>
        </div>

        <h1 class="display-1 fw-bold text-muted" th:text="${status}">Hata</h1>
        <h4 class="fw-bold" th:text="${error}">Bir sorun oluştu</h4>
        <p class="text-muted small" th:text="${message}"></p>
        <p class="text-muted small">
            <i class="bi bi-clock me-1"></i>
            <span th:text="${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy HH:mm')}"></span>
            &nbsp;·&nbsp; Yol: <code th:text="${path}"></code>
        </p>

        <div class="d-flex gap-3 justify-content-center mt-4">
            <a href="/reports" class="btn btn-primary rounded-pill px-5">
                <i class="bi bi-house me-2"></i>Ana Sayfaya Dön
            </a>
            <a href="javascript:history.back()"
               class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i>Geri
            </a>
        </div>
    </div>
</div>
</body>
</html>
