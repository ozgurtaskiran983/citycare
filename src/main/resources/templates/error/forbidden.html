<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Erişim Reddedildi — CityCare</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body style="background:#f4f7fb">
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <i class="bi bi-shield-x" style="font-size:5rem;color:#dc3545;opacity:.35"></i>
        <h1 class="display-1 fw-bold text-muted">403</h1>
        <h4 class="fw-bold" th:text="${errorTitle} ?: 'Erişim Reddedildi'"></h4>
        <p class="text-muted"
           th:text="${errorMessage} ?: 'Bu sayfayı görüntüleme yetkiniz bulunmamaktadır.'"></p>
        <div class="d-flex gap-3 justify-content-center mt-3">
            <a href="/reports" class="btn btn-primary rounded-pill px-5">
                <i class="bi bi-house me-2"></i>Ana Sayfaya Dön
            </a>
            <a href="javascript:history.back()"
               class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i>Geri
            </a>
        </div>
    </div>
</div>
</body>
</html>
