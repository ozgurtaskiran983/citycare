<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — İhbarlarim</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{background:#f4f7fb}
    .urgency-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.15)}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="fw-bold mb-0"><i class="bi bi-person-lines-fill text-primary me-2"></i>İhbarlarim</h4>
      <small class="text-muted">Toplam <strong th:text="${#lists.size(reports)}">0</strong> ihbar</small>
    </div>
    <a href="/reports/create" class="btn btn-primary rounded-pill px-4">
      <i class="bi bi-plus-circle me-1"></i>Yeni İhbar
    </a>
  </div>

  <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex gap-2">
    <i class="bi bi-check-circle-fill"></i><span th:text="${successMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Filtre -->
  <div class="card border-0 shadow-sm rounded-3 mb-4">
    <div class="card-body p-3">
      <form th:action="@{/reports/my}" method="get" class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label small fw-semibold text-muted mb-1">Başlıkta Ara</label>
          <input type="text" name="keyword" class="form-control form-control-sm"
                 placeholder="Ara..." th:value="${keyword}"/>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold text-muted mb-1">Kategori</label>
          <select name="category" class="form-select form-select-sm">
            <option value="">Tumu</option>
            <option th:each="cat:${categories}" th:value="${cat.name()}"
                    th:text="${cat.displayName}" th:selected="${cat==selectedCategory}"></option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm flex-fill">Filtrele</button>
          <a href="/reports/my" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x"></i></a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bosh -->
  <div th:if="${#lists.isEmpty(reports)}" class="text-center py-5">
    <i class="bi bi-inbox display-1 text-muted opacity-40"></i>
    <h5 class="text-muted mt-3">Henuz ihbar olusturmadiniz</h5>
    <a href="/reports/create" class="btn btn-primary mt-2 rounded-pill px-5">Ilk Ihbari Oluştur</a>
  </div>

  <!-- Tablo -->
  <div class="card border-0 shadow-sm rounded-3" th:unless="${#lists.isEmpty(reports)}">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3" style="width:50px">#</th>
            <th>Başlık</th>
            <th>Kategori</th>
            <th>Aciliyet</th>
            <th>Durum</th>
            <th>Tarih</th>
            <th class="text-end pe-3">Islem</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="report:${reports}">
            <td class="ps-3 font-monospace small text-muted" th:text="'#'+${report.id}"></td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div th:if="${report.hasImage()}"
                     class="rounded overflow-hidden flex-shrink-0" style="width:36px;height:36px">
                  <img th:src="@{/images/report/{id}(id=${report.id})}"
                       style="width:36px;height:36px;object-fit:cover" th:alt="${report.title}"/>
                </div>
                <div th:unless="${report.hasImage()}"
                     class="d-flex align-items-center justify-content-center rounded flex-shrink-0"
                     style="width:36px;height:36px;background:#e8eef6">
                  <i class="bi bi-image text-muted small"></i>
                </div>
                <span class="fw-semibold small" th:text="${#strings.abbreviate(report.title,45)}"></span>
              </div>
            </td>
            <td><span class="badge bg-light text-dark border small"
                th:text="${report.category.displayName}"></span></td>
            <td>
              <span th:each="i:${#numbers.sequence(1,5)}" class="urgency-dot me-1"
                    th:style="|background:${i <= report.urgency ? report.urgencyColor : '#dee2e6'}|"></span>
            </td>
            <td><span class="badge rounded-pill"
                th:classappend="'bg-'+${report.status.badgeClass}"
                th:text="${report.status.displayName}"></span></td>
            <td class="text-muted small"
                th:text="${#temporals.format(report.createdAt,'dd.MM.yyyy')}"></td>
            <td class="text-end pe-3">
              <div class="btn-group btn-group-sm">
                <a th:href="@{/reports/{id}(id=${report.id})}"
                   class="btn btn-outline-primary" title="Detay">
                  <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/reports/{id}/edit(id=${report.id})}"
                   class="btn btn-outline-warning" title="Düzenle">
                  <i class="bi bi-pencil"></i>
                </a>
                <button type="button" class="btn btn-outline-danger" title="Sil"
                        th:data-report-id="${report.id}"
                        th:data-report-title="${report.title}"
                        onclick="confirmDelete(this)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Silme modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-3 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold text-danger"><i class="bi bi-trash me-2"></i>Ihrabi Sil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-secondary mb-0">
          <strong id="deleteTitle"></strong> baslikli ihrabi silmek istiyor musunuz?
        </p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">İptal</button>
        <form id="deleteForm" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger rounded-pill px-4">Sil</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function confirmDelete(btn) {
  document.getElementById('deleteTitle').textContent = btn.getAttribute('data-report-title');
  document.getElementById('deleteForm').action = '/reports/' + btn.getAttribute('data-report-id') + '/delete';
  new bootstrap.Modal(document.getElementById('deleteModal')).show();
}
</script>
</body>
</html>
