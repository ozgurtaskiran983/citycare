<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — İhbarlar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{background:#f4f7fb}
    .sidebar{background:#0b3d6e;min-height:calc(100vh - 56px);padding-top:1.5rem;color:#fff;width:210px}
    .sidebar .nav-link{color:rgba(255,255,255,.72);border-radius:.5rem;padding:.55rem 1rem;margin-bottom:.15rem;transition:all .2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .sec-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;opacity:.45;padding:.8rem 1rem .25rem}
    .stat-box{background:rgba(255,255,255,.12);border-radius:.5rem;padding:.7rem 1rem;margin:.2rem 0}
    .report-card{border:none;border-radius:.9rem;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:transform .2s,box-shadow .2s;overflow:hidden}
    .report-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.13)}
    .urgency-dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.15)}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex" style="min-height:calc(100vh - 56px)">

  <!-- SIDEBAR -->
  <div class="sidebar flex-shrink-0 px-3">
    <div class="sec-label">Menu</div>
    <nav class="nav flex-column">
      <a class="nav-link active" href="/reports"><i class="bi bi-grid-fill me-2"></i>Tum İhbarlar</a>
      <a class="nav-link" href="/reports/my" sec:authorize="!hasRole('ADMIN')"><i class="bi bi-person-fill me-2"></i>İhbarlarim</a>
      <a class="nav-link" href="/reports/create" sec:authorize="!hasRole('ADMIN')"><i class="bi bi-plus-lg me-2"></i>Yeni İhbar</a>
      <a class="nav-link" href="/admin/reports" sec:authorize="hasRole('ADMIN')"><i class="bi bi-shield me-2"></i>Admin Paneli</a>
    </nav>
    <div class="sec-label mt-3">Istatistik</div>
    <div class="stat-box"><span class="d-block fw-bold fs-5 text-warning" th:text="${totalCount}">0</span><small>Toplam</small></div>
    <div class="stat-box"><span class="d-block fw-bold fs-5 text-danger" th:text="${openCount}">0</span><small>Açık</small></div>
    <div class="stat-box"><span class="d-block fw-bold fs-5 text-success" th:text="${solvedCount}">0</span><small>Çözüldü</small></div>
  </div>

  <!-- MAIN -->
  <div class="flex-grow-1 p-4">

    <!-- Başlık -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-list-check text-primary me-2"></i>Tum İhbarlar</h4>
        <small class="text-muted">Toplam <strong th:text="${totalItems}">0</strong> ihbar</small>
      </div>
      <a href="/reports/create" class="btn btn-primary rounded-pill px-4"
         sec:authorize="!hasRole('ADMIN')">
        <i class="bi bi-plus-circle me-1"></i>Yeni İhbar
      </a>
    </div>

    <!-- Alerts -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show d-flex gap-2">
      <i class="bi bi-check-circle-fill"></i><span th:text="${successMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show d-flex gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FILTRE BARI -->
    <div class="card border-0 shadow-sm rounded-3 mb-4">
      <div class="card-body p-3">
        <form th:action="@{/reports}" method="get" class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-search me-1"></i>Ara</label>
            <input type="text" name="keyword" class="form-control form-control-sm"
                   placeholder="Başlıkta ara..." th:value="${keyword}"/>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-tag me-1"></i>Kategori</label>
            <select name="category" class="form-select form-select-sm">
              <option value="">Tumü</option>
              <option th:each="cat:${categories}" th:value="${cat.name()}"
                      th:text="${cat.displayName}" th:selected="${cat==selectedCategory}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-flag me-1"></i>Durum</label>
            <select name="status" class="form-select form-select-sm">
              <option value="">Tumu</option>
              <option th:each="st:${statuses}" th:value="${st.name()}"
                      th:text="${st.displayName}" th:selected="${st==selectedStatus}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-exclamation-circle me-1"></i>Aciliyet</label>
            <select name="urgency" class="form-select form-select-sm">
              <option value="0">Tumu</option>
              <option th:each="u:${#numbers.sequence(1,5)}" th:value="${u}"
                      th:text="${u + '/5'}" th:selected="${u==selectedUrgency}"></option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold text-muted mb-1"><i class="bi bi-sort-down me-1"></i>Sirala</label>
            <select name="sortBy" class="form-select form-select-sm">
              <option value="createdAt" th:selected="${sortBy=='createdAt'}">Tarihe Gore</option>
              <option value="urgency"   th:selected="${sortBy=='urgency'}">Aciliyete Gore</option>
            </select>
          </div>
          <div class="col-md-1 d-flex gap-1">
            <button type="submit" class="btn btn-primary btn-sm flex-fill"><i class="bi bi-funnel"></i></button>
            <a href="/reports" class="btn btn-outline-secondary btn-sm"><i class="bi bi-x"></i></a>
          </div>
        </form>
      </div>
    </div>

    <!-- BOSH DURUM -->
    <div th:if="${#lists.isEmpty(reports)}" class="text-center py-5">
      <i class="bi bi-inbox display-1 text-muted opacity-40"></i>
      <h5 class="text-muted mt-3">Ihbar bulunamadi</h5>
    </div>

    <!-- KARTLAR -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" th:unless="${#lists.isEmpty(reports)}">
      <div class="col" th:each="report:${reports}">
        <div class="card h-100 report-card">

          <!-- Resim -->
          <div th:if="${report.hasImage()}">
            <img th:src="@{/images/report/{id}(id=${report.id})}"
                 class="card-img-top" style="height:170px;object-fit:cover"
                 th:alt="${report.title}"/>
          </div>
          <div th:unless="${report.hasImage()}"
               class="d-flex align-items-center justify-content-center"
               style="height:170px;background:linear-gradient(135deg,#e8eef6,#d0dce9)">
            <i class="bi bi-image text-muted" style="font-size:2.8rem;opacity:.35"></i>
          </div>

          <div class="card-body pb-2">
            <!-- Durum + Kategori -->
            <div class="d-flex gap-2 mb-2 flex-wrap">
              <span class="badge rounded-pill"
                    th:classappend="'bg-' + ${report.status.badgeClass}"
                    th:text="${report.status.displayName}"></span>
              <span class="badge bg-light text-dark border small"
                    th:text="${report.category.displayName}"></span>
            </div>

            <h6 class="card-title fw-bold mb-1" th:text="${report.title}"></h6>
            <p class="card-text text-muted small mb-2"
               th:text="${#strings.abbreviate(report.description, 80)}"></p>

            <!-- Aciliyet gostergesi -->
            <div class="d-flex align-items-center gap-1 mb-1">
              <small class="text-muted me-1">Aciliyet:</small>
              <span th:each="i:${#numbers.sequence(1,5)}"
                    class="urgency-dot"
                    th:style="|background:${i <= report.urgency ? report.urgencyColor : '#dee2e6'}|">
              </span>
              <small class="text-muted ms-1" th:text="${report.urgency} + '/5'"></small>
            </div>

            <!-- Konum (varsa) -->
            <div th:if="${report.location != null and !#strings.isEmpty(report.location)}"
                 class="small text-muted">
              <i class="bi bi-geo-alt-fill me-1 text-danger"></i>
              <span th:text="${#strings.abbreviate(report.location, 45)}"></span>
            </div>
          </div>

          <div class="card-footer bg-transparent border-0 pt-0 pb-3 px-3">
            <div class="d-flex align-items-center justify-content-between">
              <small class="text-muted">
                <i class="bi bi-person me-1"></i><span th:text="${report.user.username}"></span>
                &nbsp;·&nbsp;
                <span th:text="${#temporals.format(report.createdAt,'dd.MM.yyyy')}"></span>
              </small>
              <a th:href="@{/reports/{id}(id=${report.id})}"
                 class="btn btn-outline-primary btn-sm rounded-pill px-3">Detay</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SAYFALAMA -->
    <nav th:if="${totalPages > 1}" class="mt-4 d-flex justify-content-center">
      <ul class="pagination pagination-sm gap-1">
        <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
          <a class="page-link rounded"
             th:href="@{/reports(page=${currentPage-1},keyword=${keyword},
             category=${selectedCategory},status=${selectedStatus},
             urgency=${selectedUrgency},sortBy=${sortBy})}">
            <i class="bi bi-chevron-left"></i></a>
        </li>
        <li th:each="i:${#numbers.sequence(0,totalPages-1)}"
            class="page-item" th:classappend="${i==currentPage}?'active'">
          <a class="page-link rounded" th:text="${i+1}"
             th:href="@{/reports(page=${i},keyword=${keyword},
             category=${selectedCategory},status=${selectedStatus},
             urgency=${selectedUrgency},sortBy=${sortBy})}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage==totalPages-1}?'disabled'">
          <a class="page-link rounded"
             th:href="@{/reports(page=${currentPage+1},keyword=${keyword},
             category=${selectedCategory},status=${selectedStatus},
             urgency=${selectedUrgency},sortBy=${sortBy})}">
            <i class="bi bi-chevron-right"></i></a>
        </li>
      </ul>
    </nav>

  </div><!-- /main -->
</div><!-- /flex -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
