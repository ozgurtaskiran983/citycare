<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — Düzenle</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{background:#f4f7fb}
    .urgency-btn input{display:none}
    .urgency-btn label{display:inline-block;width:32px;height:32px;border-radius:50%;border:2.5px solid #dee2e6;cursor:pointer;transition:all .2s;opacity:.45}
    .urgency-btn input:checked + label{border-color:#333;opacity:1;transform:scale(1.18)}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4" style="max-width:780px">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb small">
      <li class="breadcrumb-item"><a href="/reports" class="text-decoration-none">İhbarlar</a></li>
      <li class="breadcrumb-item">
        <a th:href="@{/reports/{id}(id=${report.id})}" class="text-decoration-none"
           th:text="${#strings.abbreviate(report.title,30)}"></a>
      </li>
      <li class="breadcrumb-item active">Düzenle</li>
    </ol>
  </nav>

  <div class="rounded-3 p-4 mb-4 text-white"
       style="background:linear-gradient(135deg,#f0a500,#c17d00)">
    <h4 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2"></i>Ihrabi Düzenle</h4>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4">
      <form th:action="@{/reports/{id}/edit(id=${report.id})}" method="post"
            th:object="${reportDTO}" enctype="multipart/form-data" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- BASLIK -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Başlık <span class="text-danger">*</span></label>
          <input type="text" th:field="*{title}" class="form-control"
                 th:classappend="${#fields.hasErrors('title')}?'is-invalid'"/>
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <!-- KATEGORI -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Kategori <span class="text-danger">*</span></label>
          <select th:field="*{category}" class="form-select"
                  th:classappend="${#fields.hasErrors('category')}?'is-invalid'">
            <option value="">-- Seçin --</option>
            <option th:each="cat:${categories}" th:value="${cat.name()}"
                    th:text="${cat.displayName}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{category}"></div>
        </div>

        <!-- ACILIYET -->
        <div class="mb-4">
          <label class="form-label fw-semibold"><i class="bi bi-exclamation-circle me-1 text-warning"></i>Aciliyet</label>
          <div class="d-flex align-items-center gap-2 mt-1">
            <th:block th:each="u:${#numbers.sequence(1,5)}">
              <div class="urgency-btn">
                <input type="radio" th:id="'eu'+${u}" th:value="${u}" th:field="*{urgency}"/>
                <label th:for="'eu'+${u}"
                       th:style="|background:${u==1?'#28a745':u==2?'#7cb83b':u==3?'#ffc107':u==4?'#fd7e14':'#dc3545'}|"></label>
              </div>
            </th:block>
          </div>
        </div>

        <!-- ACIKLAMA -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Açıklama <span class="text-danger">*</span></label>
          <textarea th:field="*{description}" class="form-control"
                    th:classappend="${#fields.hasErrors('description')}?'is-invalid'"
                    rows="5"></textarea>
          <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <!-- KONUM -->
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-geo-alt-fill me-1 text-danger"></i>Konum Bilgisi
          </label>
          <input type="text" th:field="*{location}" class="form-control"
                 placeholder="Adres veya koordinat"/>
        </div>

        <!-- MEVCUT RESIM -->
        <div class="mb-3" th:if="${report.hasImage()}">
          <label class="form-label fw-semibold small text-muted">Mevcut Fotoğraf</label><br/>
          <img th:src="@{/images/report/{id}(id=${report.id})}"
               class="rounded-3 shadow-sm" style="max-height:150px;object-fit:cover"
               th:alt="${report.title}"/>
        </div>

        <!-- YENI RESIM -->
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-camera me-1 text-warning"></i>
            <span th:if="${report.hasImage()}">Fotoğrafi Degistir</span>
            <span th:unless="${report.hasImage()}">Fotoğraf Ekle</span>
            <span class="text-muted fw-normal small">(Opsiyonel)</span>
          </label>
          <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*"/>
          <img id="newPreview" src="#" alt="Onizleme"
               class="mt-2 rounded-3 d-none" style="max-height:140px"/>
        </div>

        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-warning text-white rounded-pill px-5 fw-semibold">
            <i class="bi bi-save me-2"></i>Kaydet
          </button>
          <a th:href="@{/reports/{id}(id=${report.id})}"
             class="btn btn-outline-secondary rounded-pill px-4">İptal</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector('input[type="file"]').addEventListener('change', function() {
  const p = document.getElementById('newPreview');
  if (this.files && this.files[0]) {
    const r = new FileReader();
    r.onload = e => { p.src = e.target.result; p.classList.remove('d-none'); };
    r.readAsDataURL(this.files[0]);
  } else p.classList.add('d-none');
});
</script>
</body>
</html>
