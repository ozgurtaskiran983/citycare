<!DOCTYPE html>
<!--
  admin/users.html - Admin user management page.

  Features:
    - Dark-mode striped table with hover effect
    - Enable / Disable toggle per user (POST /admin/users/{id}/toggle)
    - Displays report count per user
    - Active/Blocked status badge
-->
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare Yönetim — Kullanıcılar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{background:#0f0f1a;color:#d8dce8;min-height:100vh;font-size:.925rem}
    .adm-sidebar{background:#12121f;min-height:calc(100vh - 56px);width:215px;
                 padding-top:1.5rem;border-right:1px solid rgba(255,255,255,.06)}
    .adm-sidebar .nav-link{color:rgba(255,255,255,.6);border-radius:.5rem;
                            padding:.55rem 1rem;margin-bottom:.15rem;font-size:.875rem}
    .adm-sidebar .nav-link:hover,.adm-sidebar .nav-link.active
                           {background:rgba(233,69,96,.18);color:#e94560}
    .adm-sidebar .sec-lbl  {font-size:.67rem;text-transform:uppercase;
                             letter-spacing:.13em;opacity:.35;padding:.85rem 1rem .3rem;color:#fff}
    .stat-pill{background:rgba(255,255,255,.07);border-radius:.45rem;
               padding:.55rem 1rem;margin:.2rem 0;font-size:.82rem}
    .adm-table{background:#1a1a2e;width:100%}
    .adm-table thead th{background:#10101c;color:rgba(255,255,255,.45);
      font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
      padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.08)}
    .adm-table tbody tr{border-bottom:1px solid rgba(255,255,255,.05)}
    .adm-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
    .adm-table tbody tr:hover td{background:rgba(233,69,96,.07);transition:background .15s}
    .adm-table td{padding:.75rem 1rem;vertical-align:middle;color:#d8dce8}
    .avatar{width:36px;height:36px;border-radius:50%;
            background:rgba(233,69,96,.18);color:#e94560;
            display:flex;align-items:center;justify-content:center;
            font-weight:700;font-size:.85rem;flex-shrink:0}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: admin-navbar}"></div>

<div class="d-flex" style="min-height:calc(100vh - 56px)">

  <!-- ── KENAR ÇUBUĞU ── -->
  <div class="adm-sidebar flex-shrink-0 px-3">
    <div class="sec-lbl">Yönetim</div>
    <nav class="nav flex-column">
      <a class="nav-link" href="/admin"><i class="bi bi-grid-fill me-2"></i>Panel</a>
      <a class="nav-link" href="/admin/reports">
        <i class="bi bi-flag-fill me-2"></i>İhbar Kayıtları</a>
      <a class="nav-link active" href="/admin/users">
        <i class="bi bi-people-fill me-2"></i>Kullanıcılar</a>
    </nav>
    <div class="sec-lbl mt-3">İstatistik</div>
    <div class="stat-pill">
      <span class="fw-bold text-white" th:text="${totalCount}">0</span>
      <span class="opacity-50 ms-1">Toplam İhbar</span>
    </div>
    <div class="stat-pill">
      <span class="fw-bold text-warning" th:text="${openCount}">0</span>
      <span class="opacity-50 ms-1">Açık</span>
    </div>
    <div class="stat-pill">
      <span class="fw-bold text-success" th:text="${solvedCount}">0</span>
      <span class="opacity-50 ms-1">Çözüldü</span>
    </div>
  </div>

  <!-- ── ANA İÇERİK ── -->
  <div class="flex-grow-1 p-4">
    <h4 class="fw-bold mb-1 text-white">
      <i class="bi bi-people-fill me-2" style="color:#e94560"></i>Kullanıcı Yönetimi
    </h4>
    <p class="mb-4" style="color:rgba(255,255,255,.35);font-size:.875rem">
      Toplam <strong class="text-white"
                     th:text="${#lists.size(users)}">0</strong> vatandaş kayıtlı
    </p>

    <!-- Alerts -->
    <div th:if="${successMsg}"
         class="alert alert-success alert-dismissible fade show d-flex gap-2 mb-3">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${successMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}"
         class="alert alert-danger alert-dismissible fade show d-flex gap-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${errorMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Boş durum -->
    <div th:if="${#lists.isEmpty(users)}" class="text-center py-5">
      <i class="bi bi-people" style="font-size:4rem;color:rgba(255,255,255,.1)"></i>
      <p class="mt-3" style="color:rgba(255,255,255,.25)">Kayıtlı vatandaş bulunamadı.</p>
    </div>

    <!-- ── KULLANICI TABLOSU ── -->
    <div class="rounded-3 overflow-hidden" th:unless="${#lists.isEmpty(users)}"
         style="border:1px solid rgba(255,255,255,.07)">
      <table class="adm-table">
        <thead>
          <tr>
            <th style="width:60px;padding-left:1.2rem">#</th>
            <th>Kullanıcı Adı</th>
            <th>İhbar Sayısı</th>
            <th>Durum</th>
            <th class="text-end" style="padding-right:1.2rem">İşlem</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user:${users}">
            <td style="font-family:monospace;font-size:.78rem;
                       color:rgba(255,255,255,.3);padding-left:1.2rem"
                th:text="${user.id}"></td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="avatar"
                     th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">U</div>
                <span class="fw-semibold" th:text="${user.username}"></span>
              </div>
            </td>
            <td>
              <span class="badge"
                    style="background:rgba(255,255,255,.09);color:#c8d0e8;font-size:.78rem"
                    th:text="${#lists.size(user.reports)} + ' ihbar'"></span>
            </td>
            <td>
              <span th:if="${user.enabled}"
                    class="badge bg-success" style="font-size:.78rem">
                <i class="bi bi-check-circle-fill me-1"></i>Aktif
              </span>
              <span th:unless="${user.enabled}"
                    class="badge bg-danger" style="font-size:.78rem">
                <i class="bi bi-x-circle-fill me-1"></i>Engellendi
              </span>
            </td>
            <td class="text-end" style="padding-right:1rem">
              <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                    method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm rounded-pill px-3"
                        th:classappend="${user.enabled}
                            ? 'btn-outline-danger' : 'btn-outline-success'"
                        th:text="${user.enabled} ? 'Engelle' : 'Aktif Et'">
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
