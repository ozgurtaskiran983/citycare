<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CityCare — Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body{background:#0f0f1a;color:#e0e0e0;min-height:100vh}
    .admin-sidebar{background:#1a1a2e;min-height:calc(100vh - 56px);width:210px;padding-top:1.5rem}
    .admin-sidebar .nav-link{color:rgba(255,255,255,.65);border-radius:.5rem;padding:.55rem 1rem;margin-bottom:.15rem}
    .admin-sidebar .nav-link:hover,.admin-sidebar .nav-link.active{background:rgba(233,69,96,.2);color:#e94560}
    .admin-sidebar .sec-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;opacity:.4;padding:.8rem 1rem .25rem;color:#fff}
    .stat-card{background:#1a1a2e;border:1px solid rgba(255,255,255,.08);border-radius:.9rem;transition:transform .2s}
    .stat-card:hover{transform:translateY(-3px)}
    .stat-num{font-size:2.4rem;font-weight:800;line-height:1}
    .main-area{background:#0f0f1a}
  </style>
</head>
<body>
<div th:replace="~{fragments/layout :: admin-navbar}"></div>

<div class="d-flex" style="min-height:calc(100vh - 56px)">
  <!-- ADMIN SIDEBAR -->
  <div class="admin-sidebar flex-shrink-0 px-3">
    <div class="sec-label">Yonetim</div>
    <nav class="nav flex-column">
      <a class="nav-link active" href="/admin"><i class="bi bi-grid-fill me-2"></i>Dashboard</a>
      <a class="nav-link" href="/admin/reports"><i class="bi bi-flag-fill me-2"></i>Tum İhbarlar</a>
      <a class="nav-link" href="/admin/users"><i class="bi bi-people-fill me-2"></i>Kullanıcılar</a>
    </nav>
    <div class="sec-label mt-3">Hizli Filtre</div>
    <nav class="nav flex-column">
      <a class="nav-link" href="/admin/reports?status=ACIK"><i class="bi bi-exclamation-circle me-2 text-warning"></i>Açık</a>
      <a class="nav-link" href="/admin/reports?status=INCELEMEDE"><i class="bi bi-search me-2 text-info"></i>Incelemede</a>
      <a class="nav-link" href="/admin/reports?urgency=5"><i class="bi bi-fire me-2 text-danger"></i>En Acil (5)</a>
    </nav>
    <div class="sec-label mt-3">Diger</div>
    <nav class="nav flex-column">
      <a class="nav-link" href="/reports"><i class="bi bi-eye me-2"></i>Vatandas Gorunumu</a>
    </nav>
  </div>

  <!-- MAIN -->
  <div class="flex-grow-1 p-4 main-area">
    <h4 class="fw-bold mb-1 text-white"><i class="bi bi-grid-fill me-2" style="color:#e94560"></i>Dashboard</h4>
    <p class="mb-4" style="color:rgba(255,255,255,.5);font-size:.9rem">Genel sistem ozeti</p>

    <!-- STAT KARTLARI -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card p-3 h-100">
          <div class="stat-num text-white" th:text="${totalReports}">0</div>
          <div class="mt-1" style="color:rgba(255,255,255,.5);font-size:.85rem">Toplam Ihbar</div>
          <i class="bi bi-collection-fill mt-2 d-block" style="color:#6c757d;font-size:1.5rem"></i>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3 h-100">
          <div class="stat-num" style="color:#ffc107" th:text="${openCount}">0</div>
          <div class="mt-1" style="color:rgba(255,255,255,.5);font-size:.85rem">Açık</div>
          <i class="bi bi-exclamation-circle-fill mt-2 d-block" style="color:#ffc107;font-size:1.5rem"></i>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3 h-100">
          <div class="stat-num" style="color:#17a2b8" th:text="${reviewCount}">0</div>
          <div class="mt-1" style="color:rgba(255,255,255,.5);font-size:.85rem">Incelemede</div>
          <i class="bi bi-search mt-2 d-block" style="color:#17a2b8;font-size:1.5rem"></i>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card p-3 h-100">
          <div class="stat-num" style="color:#28a745" th:text="${solvedCount}">0</div>
          <div class="mt-1" style="color:rgba(255,255,255,.5);font-size:.85rem">Çözüldü</div>
          <i class="bi bi-check-circle-fill mt-2 d-block" style="color:#28a745;font-size:1.5rem"></i>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="stat-card p-3">
          <div class="stat-num" style="color:#e94560" th:text="${rejectedCount}">0</div>
          <div style="color:rgba(255,255,255,.5);font-size:.85rem;margin-top:.3rem">Reddedildi</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card p-3">
          <div class="stat-num text-white" th:text="${totalUsers}">0</div>
          <div style="color:rgba(255,255,255,.5);font-size:.85rem;margin-top:.3rem">Toplam Kullanıcı</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card p-3">
          <div class="stat-num" style="color:#28a745" th:text="${enabledUsers}">0</div>
          <div style="color:rgba(255,255,255,.5);font-size:.85rem;margin-top:.3rem">Aktif Kullanıcı</div>
        </div>
      </div>
    </div>

    <!-- HIZLI ERISIM -->
    <div class="mt-4 d-flex gap-3 flex-wrap">
      <a href="/admin/reports?status=ACIK"
         class="btn rounded-pill px-4 fw-semibold"
         style="background:#ffc107;color:#000;border:none">
        <i class="bi bi-exclamation-circle me-2"></i>Açık İhbarlara Git
      </a>
      <a href="/admin/reports?urgency=5"
         class="btn rounded-pill px-4 fw-semibold"
         style="background:#dc3545;color:#fff;border:none">
        <i class="bi bi-fire me-2"></i>En Acil İhbarlar
      </a>
      <a href="/admin/users"
         class="btn rounded-pill px-4 fw-semibold"
         style="background:#e94560;color:#fff;border:none">
        <i class="bi bi-people me-2"></i>Kullanıcılari Yonet
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
