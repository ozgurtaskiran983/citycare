# ===================================================
# CityCare - Uygulama Yapilandirmasi
# ===================================================

# Server
server.port=8080

# ===================================================
# MySQL Veritabani
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/citycare_db?useSSL=false&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234 / KENDI SIFRENIZI GIRINIZ
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# Dosya Yukleme (Max. 10MB)
# ===================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================
# Thymeleaf
# ===================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===================================================
# Logging
# ===================================================
logging.level.com.citycare=DEBUG
logging.level.org.springframework.security=INFO
